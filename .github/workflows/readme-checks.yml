name: README checks

on:
  pull_request:
    paths:
      - 'README.md'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duplicates:
    name: Duplicate link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for duplicate URLs in README
        run: |
          python3 - <<'EOF'
          import re, collections, sys
          text = open('README.md').read()
          urls = [u.rstrip('/') for u in re.findall(r'\]\((https?://[^)]+)\)', text)]
          dupes = {u: c for u, c in collections.Counter(urls).items() if c > 1}
          for u, c in sorted(dupes.items()):
              print(f'::error::URL appears {c} times in README.md: {u}')
          sys.exit(1 if dupes else 0)
          EOF

  links:
    name: Dead link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # --user-agent: the default announces lychee, and several hosts answer a
          #   bot string with 404 or a challenge page rather than the real status.
          # --max-concurrency: the default of 128 is what turns a slow host into a
          #   timeout, because we open far more sockets than it will serve at once.
          # --retry-wait-time: back off instead of retrying three times immediately.
          args: >-
            --no-progress
            --timeout 45
            --max-retries 5
            --retry-wait-time 3
            --max-concurrency 16
            --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36'
            --accept '100..=103,200..=299,403,429'
            README.md
          fail: true
